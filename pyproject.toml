[tool.poetry]
name = "mcp-agent-platform"
version = "0.3.0"
description = "MCP-native platform: existing document-qa and clauseguard projects exposed as Model Context Protocol tool servers, a LangGraph supervisor agent that routes between them, and a filesystem MCP client demo. Phase 1 tools run fully local/free; the Phase 2 supervisor uses Groq's free tier as its routing LLM; Phase 3 adds a two-layer (rule-based + LLM judge) guardrail around it. No paid API keys required."
authors = ["Naresh Kumar"]
readme = "README.md"
packages = [{ include = "mcp_agent_platform", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
mcp = "^2.2"
sentence-transformers = ">=3.3,<6"
faiss-cpu = ">=1.9,<2"
numpy = ">=1.26,<3"
pymupdf = ">=1.24,<2"
rank-bm25 = ">=0.2.2,<0.3"
python-dotenv = "^1.0"
langgraph = "^1.0"
langchain = "^1.0"
langchain-groq = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.24"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
