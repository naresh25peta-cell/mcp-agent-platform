name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run tests
        run: poetry run pytest -v
      - name: Retrieval eval gate (Phase 4)
        # Deterministic, offline: fails the build if hit@k / MRR drop below
        # the minimums recorded in src/mcp_agent_platform/evals/thresholds.json
        run: poetry run python -m mcp_agent_platform.evals.retrieval_eval --check --report eval-report.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: eval-report.json
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build document-qa image
        run: docker build -f docker/document-qa.Dockerfile -t mcp-agent-platform-document-qa .
      - name: Build clauseguard image
        run: docker build -f docker/clauseguard.Dockerfile -t mcp-agent-platform-clauseguard .
