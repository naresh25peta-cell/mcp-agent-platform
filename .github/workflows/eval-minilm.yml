name: eval (real embedding model)

# Manual run: scores retrieval with the real all-MiniLM-L6-v2 model the server
# uses in production. It reports numbers but does not gate the build, because
# no minimums have been recorded for it yet. Run it once, then record the
# results (and thresholds) deliberately.
on:
  workflow_dispatch:

jobs:
  eval-minilm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Retrieval eval with MiniLM
        run: poetry run python -m mcp_agent_platform.evals.retrieval_eval --embedder minilm --report eval-minilm.json
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-minilm
          path: eval-minilm.json
